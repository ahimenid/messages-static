<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сообщения</title>
<link rel="stylesheet" href="styles.css">
<script>
// До отрисовки, чтобы не мигать чужой темой.
var saved = localStorage.getItem('theme');
if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
</script>
</head>
<body>

<header>
  <h1>Сообщения</h1>

  <button id="open-settings" type="button" title="Настройки">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/>
    </svg>
    <span class="label">Настройки</span>
  </button>

  <p id="auth">
    <a id="login" href="#" hidden>Войти через Яндекс ID</a>
    <span id="user" hidden></span>
    <button id="logout" type="button" title="Выйти" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 4.5H6.5v15H14M11 12h9M16.5 8.5 20 12l-3.5 3.5"/>
      </svg>
      <span class="label">Выйти</span>
    </button>
  </p>
</header>

<dialog id="settings">
  <form method="dialog">
    <h2>Настройки</h2>

    <p>
      <label for="room">Комната</label>
      <select id="room"></select>
    </p>

    <p>
      <label for="level">Показывать от уровня</label>
      <select id="level">
        <option value="trace">trace</option>
        <option value="debug">debug</option>
        <option value="info">info</option>
        <option value="warning">warning</option>
        <option value="error">error</option>
        <option value="critical">critical</option>
      </select>
    </p>

    <p>
      <label><input id="unresolved" type="checkbox"> Только нерешённые</label>
    </p>

    <p>
      <label for="theme">Тема</label>
      <select id="theme">
        <option value="system">Системная</option>
        <option value="light">Светлая</option>
        <option value="dark">Тёмная</option>
      </select>
    </p>

    <p id="settings-scope">Фильтры сохраняются для этой комнаты, тема — для этого устройства.</p>

    <button id="close-settings" value="close" type="submit">Закрыть</button>
  </form>
</dialog>

<main>
  <p id="status" role="status">Загрузка…</p>
  <ol id="messages"></ol>
  <button id="more" type="button" hidden>Показать ещё</button>
</main>

<script src="app.js"></script>
</body>
</html>
