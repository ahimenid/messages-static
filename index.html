<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сообщения</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Сообщения</h1>
  <button id="open-settings" type="button">Настройки</button>
  <p id="auth">
    <a id="login" href="#" hidden>Войти через Яндекс ID</a>
    <span id="user" hidden></span>
    <button id="logout" type="button" hidden>Выйти</button>
  </p>
</header>

<dialog id="settings">
  <form method="dialog">
    <h2>Настройки</h2>

    <p>
      <label for="room">Комната</label>
      <select id="room"></select>
    </p>

    <p>
      <label for="level">Показывать от уровня</label>
      <select id="level">
        <option value="trace">trace</option>
        <option value="debug">debug</option>
        <option value="info">info</option>
        <option value="warning">warning</option>
        <option value="error">error</option>
        <option value="critical">critical</option>
      </select>
    </p>

    <p>
      <label><input id="unresolved" type="checkbox"> Только нерешённые</label>
    </p>

    <p id="settings-scope">Настройки сохраняются для этой комнаты.</p>

    <button id="close-settings" value="close" type="submit">Закрыть</button>
  </form>
</dialog>

<main>
  <p id="status" role="status">Загрузка…</p>
  <ol id="messages"></ol>
  <button id="more" type="button" hidden>Показать ещё</button>
</main>

<script src="app.js"></script>
</body>
</html>
